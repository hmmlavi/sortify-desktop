<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tile" x1="8" y1="4" x2="56" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#122528"/>
      <stop offset="0.55" stop-color="#0B1417"/>
      <stop offset="1" stop-color="#070D0F"/>
    </linearGradient>
    <linearGradient id="rim" x1="8" y1="5" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BFF3EC" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#7FD8D0" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#79B8B2" stop-opacity="0.34"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(33 33) rotate(90) scale(27)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DB3AA" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#2DB3AA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ribbonTop" x1="13" y1="21" x2="51" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FE3DA"/>
      <stop offset="1" stop-color="#B8F3EC"/>
    </linearGradient>
    <linearGradient id="ribbonMid" x1="13" y1="32" x2="51" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#CFE6E3"/>
      <stop offset="1" stop-color="#F3FBFA"/>
    </linearGradient>
    <linearGradient id="ribbonLow" x1="13" y1="43" x2="51" y2="43" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C9A874"/>
      <stop offset="1" stop-color="#EBD6AE"/>
    </linearGradient>
  </defs>

  <!-- Squircle tile -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="17.5" fill="url(#tile)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="17.5" fill="url(#glow)"/>
  <rect x="3.3" y="3.3" width="57.4" height="57.4" rx="16.8" stroke="url(#rim)" stroke-width="1.4"/>

  <!-- Delicate top specular edge -->
  <path d="M19 4.4H45C50.4 4.4 54.8 7.2 56.7 11.6" stroke="#E9FFFC" stroke-opacity="0.34" stroke-width="1" stroke-linecap="round"/>

  <!-- Three disordered streams resolving into aligned order -->
  <path d="M13.5 20.5C18.2 13.6 23.4 27.4 28.2 20.5C31.2 16.4 33.8 19.4 36 20.5L50.5 20.5"
        stroke="url(#ribbonTop)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M13.5 32C19.2 24.8 24.4 39.2 30.4 32C33.2 28.6 35.2 31.3 37 32L50.5 32"
        stroke="url(#ribbonMid)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M13.5 43.5C18.2 37.6 23.4 50.4 28.2 43.5C31.2 39.4 33.8 42.4 36 43.5L50.5 43.5"
        stroke="url(#ribbonLow)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Alignment node -->
  <circle cx="51.2" cy="32" r="2.55" fill="#F4DFBC"/>
</svg>
